[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darq"
version = "7.7.3"
description = "Additive harness of prompts, agents, skills and commands for AI coding CLIs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
darq = "darq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"darq" = ["identity.json"]
"darq.content" = ["**/*"]
"darq.adapters" = ["**/assets/**/*"]
